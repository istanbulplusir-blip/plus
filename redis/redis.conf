# Redis configuration for production
# Security hardened configuration for Plus (istanbulplus.ir) project

# Network - Bind to all interfaces (Docker network isolation provides security)
# Container is NOT exposed to host, only accessible within Docker network
bind 0.0.0.0
port 6379
protected-mode yes

# Security - Password authentication required
# Password is set via command line from environment variable
requirepass CHANGE_REDIS_PASSWORD

# Memory management - Higher limit for Plus project
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence - RDB snapshots
save 900 1
save 300 10
save 60 10000

# Append Only File (AOF) for better durability
appendonly yes
appendfsync everysec

# Logging - Write to stdout (Docker will capture)
loglevel notice
logfile ""

# Performance
tcp-keepalive 300
timeout 300

# Disable dangerous commands for security
# These commands are completely disabled (renamed to empty string)
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""

# Client connections - Limit to prevent DoS
maxclients 1000

# Slow log - Monitor slow queries
slowlog-log-slower-than 10000
slowlog-max-len 128

# Additional security settings
# Disable replication if not needed
# repl-disable-tcp-nodelay no

# Limit memory for replication backlog
# repl-backlog-size 1mb
