# Istanbul Plus Centralized Logging Configuration
# This configuration sets up structured logging for all services

[loggers]
keys=root,django,users,products,cart,orders,payments,core,security,performance

[handlers]
keys=consoleHandler,fileHandler,jsonHandler,errorHandler,securityHandler

[formatters]
keys=simpleFormatter,jsonFormatter,detailedFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_django]
level=INFO
handlers=consoleHandler,fileHandler,jsonHandler
qualname=django
propagate=0

[logger_users]
level=INFO
handlers=consoleHandler,fileHandler,jsonHandler
qualname=users
propagate=0

[logger_products]
level=INFO
handlers=consoleHandler,fileHandler,jsonHandler
qualname=products
propagate=0

[logger_cart]
level=INFO
handlers=consoleHandler,fileHandler,jsonHandler
qualname=cart
propagate=0

[logger_orders]
level=INFO
handlers=consoleHandler,fileHandler,jsonHandler
qualname=orders
propagate=0

[logger_payments]
level=INFO
handlers=consoleHandler,fileHandler,jsonHandler
qualname=payments
propagate=0

[logger_core]
level=INFO
handlers=consoleHandler,fileHandler,jsonHandler
qualname=core
propagate=0

[logger_security]
level=WARNING
handlers=securityHandler,jsonHandler
qualname=security
propagate=0

[logger_performance]
level=INFO
handlers=fileHandler,jsonHandler
qualname=performance
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=detailedFormatter
args=('/var/log/istanbulplus/application.log', 'a', 10485760, 5)

[handler_jsonHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=jsonFormatter
args=('/var/log/istanbulplus/application.json', 'a', 10485760, 5)

[handler_errorHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=detailedFormatter
args=('/var/log/istanbulplus/error.log', 'a', 10485760, 5)

[handler_securityHandler]
class=handlers.RotatingFileHandler
level=WARNING
formatter=jsonFormatter
args=('/var/log/istanbulplus/security.log', 'a', 10485760, 10)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_detailedFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(module)s - %(funcName)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_jsonFormatter]
format={"timestamp": "%(asctime)s", "logger": "%(name)s", "level": "%(levelname)s", "module": "%(module)s", "function": "%(funcName)s", "line": %(lineno)d, "message": "%(message)s", "process": %(process)d, "thread": %(thread)d}
datefmt=%Y-%m-%dT%H:%M:%S
