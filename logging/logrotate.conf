# Logrotate configuration for Istanbul Plus
# This configuration manages log file rotation and compression

/var/log/istanbulplus/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 istanbulplus istanbulplus
    postrotate
        # Reload Django application to reopen log files
        docker-compose exec istanbulplus-web python manage.py shell -c "
        import logging
        for handler in logging.root.handlers[:]:
            if hasattr(handler, 'stream') and hasattr(handler.stream, 'fileno'):
                handler.stream.close()
        logging.shutdown()
        "
    endscript
}

/var/log/istanbulplus/security.log {
    daily
    missingok
    rotate 90
    compress
    delaycompress
    notifempty
    create 644 istanbulplus istanbulplus
    postrotate
        # Send security alerts if needed
        /usr/local/bin/security-alert.sh
    endscript
}

/var/log/istanbulplus/error.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 644 istanbulplus istanbulplus
    postrotate
        # Send error alerts
        /usr/local/bin/error-alert.sh
    endscript
}

/var/log/istanbulplus/application.json {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 istanbulplus istanbulplus
    postrotate
        # Process JSON logs for analysis
        /usr/local/bin/process-json-logs.sh
    endscript
}
