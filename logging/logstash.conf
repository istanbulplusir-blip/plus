input {
  # File input for Istanbul Plus logs
  file {
    path => "/var/log/istanbulplus/*.log"
    type => "istanbulplus"
    start_position => "beginning"
    codec => multiline {
      pattern => "^%{TIMESTAMP_ISO8601}"
      negate => true
      what => "previous"
    }
  }

  # JSON log input
  file {
    path => "/var/log/istanbulplus/*.json"
    type => "istanbulplus-json"
    start_position => "beginning"
    codec => "json"
  }

  # Docker container logs
  beats {
    port => 5044
  }
}

filter {
  if [type] == "istanbulplus" {
    # Parse Django log format
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{WORD:logger} - %{LOGLEVEL:level} - %{WORD:module} - %{WORD:function}:%{INT:line} - %{GREEDYDATA:log_message}"
      }
    }

    # Parse timestamp
    date {
      match => [ "timestamp", "ISO8601" ]
    }

    # Add service name
    mutate {
      add_field => { "service" => "istanbulplus" }
    }
  }

  if [type] == "istanbulplus-json" {
    # JSON logs are already parsed
    date {
      match => [ "timestamp", "ISO8601" ]
    }

    mutate {
      add_field => { "service" => "istanbulplus" }
    }
  }

  # Security log processing
  if [logger] == "security" {
    mutate {
      add_tag => [ "security" ]
    }

    # Extract IP addresses
    grok {
      match => { "log_message" => "%{IP:client_ip}" }
    }

    # Extract user agents
    grok {
      match => { "log_message" => "%{GREEDYDATA}User-Agent: %{GREEDYDATA:user_agent}" }
    }
  }

  # Performance log processing
  if [logger] == "performance" {
    mutate {
      add_tag => [ "performance" ]
    }

    # Extract response times
    grok {
      match => { "log_message" => "Response time: %{NUMBER:response_time:float}ms" }
    }
  }

  # Error log processing
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  }

  # Clean up fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "istanbulplus-logs-%{+YYYY.MM.dd}"
  }

  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}
