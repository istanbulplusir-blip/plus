version: '3.8'

services:
  # Istanbul Plus Services
  istanbulplus-web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: istanbulplus-web
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DEBUG=False
      - DB_NAME=istanbulplus_db
      - DB_USER=istanbulplus_user
      - DB_PASSWORD=${ISTANBULPLUS_DB_PASSWORD}
      - DB_HOST=istanbulplus-db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/3
      - REDIS_RATE_LIMIT_URL=redis://redis:6379/4
      - SECRET_KEY=${ISTANBULPLUS_SECRET_KEY}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - OTP_SMS_API_KEY=${OTP_SMS_API_KEY}
      - PAYMENT_MERCHANT_ID=${PAYMENT_MERCHANT_ID}
      - SITE_URL=https://istanbulplus.ir
    volumes:
      - plus_media:/app/media
      - plus_static:/app/staticfiles
    depends_on:
      istanbulplus-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - istanbulplus_network
      - shared_network

  istanbulplus-db:
    image: postgres:15-alpine
    container_name: istanbulplus-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=istanbulplus_db
      - POSTGRES_USER=istanbulplus_user
      - POSTGRES_PASSWORD=${ISTANBULPLUS_DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - plus_db_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istanbulplus_user -d istanbulplus_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - istanbulplus_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  istanbulplus-celery:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: istanbulplus-celery
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DB_NAME=istanbulplus_db
      - DB_USER=istanbulplus_user
      - DB_PASSWORD=${ISTANBULPLUS_DB_PASSWORD}
      - DB_HOST=istanbulplus-db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/5
      - REDIS_RESULT_URL=redis://redis:6379/6
      - SECRET_KEY=${ISTANBULPLUS_SECRET_KEY}
    volumes:
      - plus_media:/app/media
    depends_on:
      istanbulplus-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - istanbulplus_network
      - shared_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Peykan Tourism Services - External containers from plusistanbul project
  # These services are managed by plusistanbul/docker-compose.production-dev.yml

  # Shared Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - plus_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_ssl_certs:/etc/nginx/ssl:ro
      - plus_static:/var/www/plus/static:ro
      - plus_media:/var/www/plus/media:ro
      - peykan_static:/var/www/peykan/static:ro
      - peykan_media:/var/www/peykan/media:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      istanbulplus-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shared_network
      - peykan_external  # Connect to Peykan external network

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - plus_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Changed to 3001 to avoid conflict with Peykan frontend
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - plus_grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  # Plus project volumes with unique names
  plus_db_data:
    driver: local
  plus_media:
    driver: local
  plus_static:
    driver: local
  plus_redis_data:
    driver: local
  plus_prometheus_data:
    driver: local
  plus_grafana_data:
    driver: local
  
  # Shared volumes for nginx
  nginx_ssl_certs:
    driver: local
  nginx_logs:
    driver: local
  
  # External volumes from Peykan project
  peykan_media:
    external: true
    name: plusistanbul_media_volume_dev
  peykan_static:
    external: true
    name: plusistanbul_static_volume_dev

networks:
  # Plus internal network
  istanbulplus_network:
    driver: bridge
  
  # Shared network for nginx and redis
  shared_network:
    driver: bridge
  
  # Monitoring network
  monitoring_network:
    driver: bridge
  
  # External network to connect to Peykan services
  peykan_external:
    external: true
    name: plusistanbul_peykan_external
