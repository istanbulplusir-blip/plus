# Peykan Tourism Configuration

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name peykantravelistanbul.com www.peykantravelistanbul.com;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name peykantravelistanbul.com www.peykantravelistanbul.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/peykantravelistanbul.com.crt;
    ssl_certificate_key /etc/nginx/ssl/peykantravelistanbul.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend routes (Next.js)
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://peykan_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket support for Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # API endpoints (Django backend)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://peykan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin interface (Django backend)
    location /admin/ {
        proxy_pass http://peykan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (Django backend)
    location /static/ {
        alias /var/www/peykan/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        
        # Try to serve file, fallback to backend if not found
        try_files $uri @backend_static;
    }
    
    # Fallback for static files
    location @backend_static {
        proxy_pass http://peykan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media files (Django backend)
    location /media/ {
        alias /var/www/peykan/media/;
        expires 1M;
        add_header Cache-Control "public";
        
        # Try to serve file, fallback to backend if not found
        try_files $uri @backend_media;
    }
    
    # Fallback for media files
    location @backend_media {
        proxy_pass http://peykan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health/ {
        access_log off;
        proxy_pass http://peykan_backend;
        proxy_set_header Host $host;
    }

    # Security - deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/peykan/static/favicon.ico;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        alias /var/www/peykan/static/robots.txt;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }
}
