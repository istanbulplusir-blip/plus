user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    # limit_req_zone $binary_remote_addr zone=peykan_api:10m rate=10r/s;

    # Upstream servers for Istanbul Plus
    upstream istanbulplus_backend {
        server istanbulplus-web:8000;
        keepalive 32;
    }

    # Upstream servers for Peykan (existing project) - commented out for now
    # upstream peykan_backend {
    #     server peykan_backend:8000;
    #     keepalive 32;
    # }

    # upstream peykan_frontend {
    #     server peykan_frontend:3000;
    #     keepalive 32;
    # }

    # HTTP to HTTPS redirect for Istanbul Plus
    server {
        listen 80;
        server_name istanbulplus.ir www.istanbulplus.ir;
        return 301 https://$server_name$request_uri;
    }

    # HTTP to HTTPS redirect for Peykan - commented out for now
    # server {
    #     listen 80;
    #     server_name peykantravelistanbul.com www.peykantravelistanbul.com;
    #     return 301 https://$server_name$request_uri;
    # }

    # Istanbul Plus - HTTPS server
    server {
        listen 443 ssl http2;
        server_name istanbulplus.ir www.istanbulplus.ir;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/istanbulplus.ir.crt;
        ssl_certificate_key /etc/nginx/ssl/istanbulplus.ir.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Main location
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://istanbulplus_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://istanbulplus_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://istanbulplus_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /static/ {
            alias /var/www/istanbulplus/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Media files
        location /media/ {
            alias /var/www/istanbulplus/media/;
            expires 1M;
            add_header Cache-Control "public";
        }

        # Admin interface
        location /admin/ {
            proxy_pass http://istanbulplus_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health/ {
            access_log off;
            proxy_pass http://istanbulplus_backend;
            proxy_set_header Host $host;
        }
    }

    # Peykan Tourism - HTTPS server (existing project) - commented out for now
    # server {
    #     listen 443 ssl http2;
    #     server_name peykantravelistanbul.com www.peykantravelistanbul.com;
    #     ...
    # }
}
